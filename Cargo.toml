[workspace]
members = ["ironland-config", "ironlandctl"]
# `cargo build`/`cargo test` with no `-p`/`--workspace` only builds the
# default members; since this manifest is both the workspace root and the
# `ironland-compositor` package, that would otherwise mean just the
# compositor itself. List `ironlandctl` too so `nix build` (crane's plain
# `cargo build .`) produces it as well, without every other cargo
# invocation needing an explicit `--workspace` or `-p`.
default-members = [".", "ironlandctl"]

[package]
name = "ironland-compositor"
version = "0.1.0"
edition = "2024"
license = "MIT"
default-run = "ironland-compositor"

[[bin]]
name = "ironland-compositor"
path = "src/main.rs"

# A small standalone Wayland client, not part of the compositor binary
# itself: bridges the `ext-workspace-v1` global (see `src/ext_workspace.rs`)
# to line-delimited JSON on stdin/stdout, since Quickshell (what
# molunga-shell is built on) has no built-in support for that protocol.
# See its own module doc for the wire format.
[[bin]]
name = "ironland-workspaces"
path = "src/bin/ironland_workspaces.rs"

# A small standalone Wayland client + D-Bus service: the
# `org.freedesktop.impl.portal.GlobalShortcuts` backend for
# xdg-desktop-portal, bridging it to `ironland-shortcuts-v1`'s `bind`
# request (protocol version 2+; see `src/shortcuts.rs`). See its own module
# doc for scope/limitations.
[[bin]]
name = "ironland-portal-global-shortcuts"
path = "src/bin/ironland_portal_global_shortcuts.rs"

# The `org.freedesktop.impl.portal.Screenshot` backend for
# xdg-desktop-portal: captures a frame via `ext-image-capture-source-v1`/
# `ext-image-copy-capture-v1` (protocol version 1) over the compositor's
# privileged capture socket (see `crate::screencopy`), gated by a
# per-app_id permission prompt/grant store. See its own module doc.
[[bin]]
name = "ironland-portal-screenshot"
path = "src/bin/ironland_portal_screenshot.rs"

# The `org.freedesktop.impl.portal.ScreenCast` backend for
# xdg-desktop-portal: streams `ext-image-copy-capture-v1` frames (over the
# same privileged capture socket the Screenshot backend uses) into a
# PipeWire video node, which is what OBS, browsers etc. record from. See
# its own module doc.
[[bin]]
name = "ironland-portal-screencast"
path = "src/bin/ironland_portal_screencast.rs"

[dependencies]
ironland-config = { path = "ironland-config" }
zbus = "4"
# PipeWire video stream for `ironland-portal-screencast`; needs libpipewire
# and libclang (bindgen) at build time - see `flake.nix`.
pipewire = { version = "0.10", features = ["v0_3_34"] }
async-channel = "2"
async-io = "2"
bitflags = "2.2.1"
rand = "0.8"
# Pinned to the same major version wayland-backend (a smithay dependency)
# already pulls in transitively, so this is the same compiled instance, not
# a second copy. Used directly (not just through smithay) for
# `pidfd_open` - see `crate::screencopy::client_identity` - and for the
# non-blocking pipe `crate::clipboard` reads captured clipboard content
# through.
rustix = { version = "1.1", default-features = false, features = ["std", "process", "pipe", "event", "time"] }
tracing = { version = "0.1.37", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
thiserror = "1"
xcursor = "0.3.3"
xkbcommon = "0.8.0"
profiling = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.129"
toml = "1.1.5"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", default-features = false, features = ["staging", "client"] }
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"
image = { version = "0.25.10", default-features = false, features = ["webp", "png", "jpeg"] }
wayland-protocols-wlr = { version = "0.3.12", default-features = false, features = ["server"] }
# Pinned to the exact versions smithay (see the `[dependencies.smithay]`
# git rev below) resolves to, so these are the same crate instances as
# `smithay::reexports::wayland_server`/`wayland_backend` - not a second,
# incompatible copy. Needed directly (rather than only transitively through
# smithay) to generate server bindings for Hyprland's own protocol
# extensions (`hyprland-focus-grab-v1`, `hyprland-global-shortcuts-v1`; see
# `src/hyprland_protocols.rs`), which aren't in the `wayland-protocols`/
# `wayland-protocols-wlr` crates.
wayland-server = "0.31.14"
# `libwayland_server_1_23` unlocks `Handle::set_default_max_buffer_size`
# (used in `state.rs`, see the comment there) - it's an opt-in Cargo feature
# rather than auto-detected because it links
# `wl_display_set_default_max_buffer_size`, only present in
# libwayland-server >= 1.23 (2024-09); fine here since ironland-compositor
# already targets a current libwayland.
wayland-backend = { version = "0.3.17", features = ["libwayland_server_1_23"] }
wayland-scanner = "0.31.11"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "28c8e0fad905f3e7d01c2446fb60d26659071684"
default-features = false
features = [
  "desktop",
  "wayland_frontend",
  "use_system_lib",
  "backend_egl",
  "backend_winit",
  "backend_libinput",
  "backend_udev",
  "backend_drm",
  "backend_gbm",
  "backend_vulkan",
  "backend_session_libseat",
  "renderer_gl",
  "renderer_pixman",
  "renderer_multi",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay.git"
rev = "28c8e0fad905f3e7d01c2446fb60d26659071684"

[features]
default = ["egl", "winit", "udev", "xwayland"]
egl = []
winit = []
udev = []
debug = []
x11 = []
xwayland = ["smithay/xwayland"]
libei = []
renderer_sync = []
